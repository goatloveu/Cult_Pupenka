<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Наш Быт</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: var(--tg-theme-bg-color, #ffffff);
            color: var(--tg-theme-text-color, #000000);
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }
        h2 { margin-top: 0; }
        .add-task { display: flex; gap: 10px; margin-bottom: 20px; }
        input[type="text"] {
            flex-grow: 1; padding: 12px; border-radius: 8px;
            border: 1px solid var(--tg-theme-hint-color, #ccc); font-size: 16px;
        }
        button.add-btn {
            padding: 12px 20px; border-radius: 8px; border: none;
            background-color: var(--tg-theme-button-color, #2481cc);
            color: var(--tg-theme-button-text-color, #ffffff);
            font-size: 16px; font-weight: bold; cursor: pointer;
        }
        ul { list-style: none; padding: 0; }
        li {
            padding: 15px; background-color: var(--tg-theme-secondary-bg-color, #f1f1f1);
            border-radius: 8px; margin-bottom: 10px; display: flex; align-items: center; justify-content: space-between;
        }
        .task-left { display: flex; align-items: center; gap: 10px; flex-grow: 1; }
        .task-text { font-size: 16px; }
        .done { text-decoration: line-through; opacity: 0.6; }
        
        /* Стили для чекбокса */
        input[type="checkbox"] { width: 20px; height: 20px; cursor: pointer; }
        
        /* Стили для кнопки удаления */
        .delete-btn {
            background: none; border: none; font-size: 18px; cursor: pointer; 
            color: #ff4d4d; padding: 5px; opacity: 0.7;
        }
        .delete-btn:hover { opacity: 1; }
    </style>
</head>
<body>
    <h2>Наши дела</h2>
    <div class="add-task">
        <input type="text" id="task-input" placeholder="Что нужно сделать?">
        <button class="add-btn" onclick="addTask()">Добавить</button>
    </div>
    <ul id="task-list">
        <li>Загрузка задач...</li>
    </ul>

    <script>
        const tg = window.Telegram.WebApp;
        tg.ready();
        tg.expand();

        // --- НАСТРОЙКИ SUPABASE ---
        const supabaseUrl = 'https://uycdmmsocewesgppjswf.supabase.co';
        // ВАШ КЛЮЧ (ОН УЖЕ ВСТАВЛЕН, НО МОЖЕТЕ ПРОВЕРИТЬ)
        const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InV5Y2RtbXNvY2V3ZXNncHBqc3dmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTQxNjEwMjUsImV4cCI6MjEwOTczNzAyNX0.b8JpqyHy1p7r29aCwPEhufiSTlOxSTk-khDHv_m_PQk'; 
        
        const supabaseClient = window.supabase.createClient(supabaseUrl, supabaseKey);
        // --------------------------

        async function loadTasks() {
            const { data: tasks, error } = await supabaseClient
                .from('tasks').select('*').order('created_at', { ascending: false });

            const list = document.getElementById('task-list');
            list.innerHTML = ''; 

            if (error) {
                list.innerHTML = `<li>Ошибка загрузки: ${error.message}</li>`;
                return;
            }
            if (tasks.length === 0) {
                list.innerHTML = `<li>Пока нет задач. Добавьте первую!</li>`;
                return;
            }
            
            tasks.forEach(task => {
                const li = document.createElement('li');
                
                // Левая часть с чекбоксом и текстом
                const leftDiv = document.createElement('div');
                leftDiv.className = 'task-left';
                
                const checkbox = document.createElement('input');
                checkbox.type = 'checkbox';
                checkbox.checked = task.is_done;
                // При клике на чекбокс вызываем функцию обновления
                checkbox.onchange = () => toggleTask(task.id, task.is_done);

                const span = document.createElement('span');
                span.className = task.is_done ? 'task-text done' : 'task-text';
                span.textContent = task.title;

                leftDiv.appendChild(checkbox);
                leftDiv.appendChild(span);

                // Правая часть - кнопка удаления
                const delBtn = document.createElement('button');
                delBtn.className = 'delete-btn';
                delBtn.innerHTML = '✖';
                delBtn.onclick = () => deleteTask(task.id);

                li.appendChild(leftDiv);
                li.appendChild(delBtn);
                list.appendChild(li);
            });
        }

        async function addTask() {
            const input = document.getElementById('task-input');
            const title = input.value.trim();
            if (!title) return; 

            const { error } = await supabaseClient.from('tasks').insert([{ title: title, is_done: false }]);
            if (!error) {
                input.value = ''; 
                loadTasks(); 
            } else {
                alert('Ошибка при добавлении: ' + error.message);
            }
        }

        // НОВАЯ ФУНКЦИЯ: Отметить выполненным / невыполненным
        async function toggleTask(id, currentStatus) {
            const { error } = await supabaseClient
                .from('tasks')
                .update({ is_done: !currentStatus }) // Меняем статус на противоположный
                .eq('id', id);
            if (!error) loadTasks();
        }

        // НОВАЯ ФУНКЦИЯ: Удалить задачу
        async function deleteTask(id) {
            const { error } = await supabaseClient
                .from('tasks')
                .delete()
                .eq('id', id); // Находим по ID и удаляем
            if (!error) loadTasks();
        }

        loadTasks();
    </script>
</body>
</html>
