<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Наш Быт</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root { --radius: 12px; --shadow: 0 2px 8px rgba(0,0,0,0.05); }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: var(--tg-theme-bg-color, #ffffff); color: var(--tg-theme-text-color, #000000);
            margin: 0; padding: 16px; box-sizing: border-box;
        }
        
        .tabs { display: flex; gap: 8px; margin-bottom: 20px; background: var(--tg-theme-secondary-bg-color, #f1f1f1); padding: 4px; border-radius: var(--radius); }
        .tab-btn { flex: 1; padding: 10px; border-radius: 8px; border: none; background: transparent; color: var(--tg-theme-text-color, #000); font-size: 14px; font-weight: 600; cursor: pointer; transition: 0.2s; }
        .tab-btn.active { background-color: var(--tg-theme-button-color, #2481cc); color: #fff; box-shadow: var(--shadow); }

        /* Формы */
        .add-form { display: flex; flex-direction: column; gap: 8px; margin-bottom: 20px; background: var(--tg-theme-secondary-bg-color, #f1f1f1); padding: 12px; border-radius: var(--radius); }
        .form-row { display: flex; gap: 8px; }
        input, select {
            padding: 10px; border-radius: 8px; border: 1px solid var(--tg-theme-hint-color, #ccc); font-size: 14px;
            box-sizing: border-box; background: var(--tg-theme-bg-color, #fff); color: var(--tg-theme-text-color, #000); outline: none; flex: 1;
        }
        button.add-btn { padding: 12px; border-radius: 8px; border: none; background-color: var(--tg-theme-button-color, #2481cc); color: #fff; font-size: 15px; font-weight: bold; cursor: pointer; width: 100%; transition: 0.2s; }
        
        /* Списки задач */
        ul { list-style: none; padding: 0; margin: 0; display: flex; flex-direction: column; gap: 10px; }
        li { padding: 14px; background-color: var(--tg-theme-bg-color, #fff); border-radius: var(--radius); display: flex; align-items: flex-start; justify-content: space-between; box-shadow: var(--shadow); border: 1px solid var(--tg-theme-secondary-bg-color, #f1f1f1); }
        
        .task-left { display: flex; align-items: flex-start; gap: 12px; flex-grow: 1; }
        input[type="checkbox"] { width: 20px; height: 20px; cursor: pointer; margin-top: 2px; }
        .done { text-decoration: line-through; opacity: 0.5; }
        
        .task-content { display: flex; flex-direction: column; gap: 4px; }
        .task-title { font-weight: 600; font-size: 15px; }
        .task-meta { font-size: 11px; opacity: 0.7; display: flex; gap: 6px; flex-wrap: wrap; }
        .badge { background: var(--tg-theme-secondary-bg-color, #e0e0e0); padding: 2px 6px; border-radius: 4px; }
        
        .delete-btn { background: none; border: none; font-size: 16px; cursor: pointer; color: #ff4d4d; opacity: 0.5; padding: 0 4px; }
        
        /* Бюджет */
        .budget-summary { display: flex; justify-content: space-between; margin-bottom: 20px; gap: 10px; }
        .budget-card { flex: 1; background: var(--tg-theme-secondary-bg-color, #f1f1f1); padding: 12px; border-radius: var(--radius); text-align: center; display: flex; flex-direction: column; }
        .budget-card-title { font-size: 11px; opacity: 0.7; text-transform: uppercase; margin-bottom: 4px; }
        .budget-card-value { font-size: 16px; font-weight: 800; }
        .income-text { color: #2ecc71; }
        .expense-text { color: #ff4d4d; }
        
        .trans-info { display: flex; flex-direction: column; gap: 4px; }
        .trans-title { font-weight: 600; font-size: 14px; display: flex; align-items: center; gap: 6px; }
        .trans-amount { font-weight: bold; font-size: 15px; }
        
        .section-title { font-size: 18px; font-weight: bold; margin: 24px 0 12px 0; border-bottom: 2px solid var(--tg-theme-secondary-bg-color, #f1f1f1); padding-bottom: 8px; }
        .empty-state { text-align: center; opacity: 0.5; padding: 20px; font-style: italic; font-size: 14px; }
    </style>
</head>
<body>
    <div class="tabs">
        <button class="tab-btn active" id="tab-tasks" onclick="switchTab('tasks')">🏠 Менеджер</button>
        <button class="tab-btn" id="tab-budget" onclick="switchTab('budget')">💰 Бюджет</button>
    </div>

    <!-- ВКЛАДКА: ДОМАШНИЙ МЕНЕДЖЕР -->
    <div id="tasks-view">
        <div class="add-form">
            <input type="text" id="task-input" placeholder="Название задачи...">
            <div class="form-row">
                <select id="task-category">
                    <option value="Уборка">🧹 Уборка</option>
                    <option value="Работа">💼 Работа</option>
                    <option value="Здоровье">💊 Здоровье</option>
                    <option value="Хобби">🎨 Хобби</option>
                    <option value="Другое">📦 Другое</option>
                </select>
                <select id="task-priority">
                    <option value="Обычная">⚪ Обычная</option>
                    <option value="Важная">🔴 Важная</option>
                    <option value="Срочная">🔥 Срочная</option>
                </select>
            </div>
            <div class="form-row">
                <input type="date" id="task-date" title="Дата выполнения">
                <select id="task-assignee">
                    <option value="">Исполнитель...</option>
                    <option value="Муж">Муж</option>
                    <option value="Жена">Жена</option>
                    <option value="Вместе">Вместе</option>
                </select>
            </div>
            <button class="add-btn" onclick="addTask()">Добавить задачу</button>
        </div>
        <ul id="task-list"><li class="empty-state">Загрузка...</li></ul>
    </div>

    <!-- ВКЛАДКА: БЮДЖЕТ -->
    <div id="budget-view" style="display: none;">
        <div class="budget-summary">
            <div class="budget-card"><span class="budget-card-title">Доходы</span><span id="total-income" class="budget-card-value income-text">0 ₽</span></div>
            <div class="budget-card"><span class="budget-card-title">Расходы</span><span id="total-expense" class="budget-card-value expense-text">0 ₽</span></div>
            <div class="budget-card"><span class="budget-card-title">Баланс</span><span id="total-balance" class="budget-card-value">0 ₽</span></div>
        </div>

        <div class="add-form">
            <div class="form-row">
                <select id="trans-type"><option value="expense">Расход</option><option value="income">Доход</option></select>
                <select id="trans-category">
                    <option value="Продукты">🍔 Продукты</option><option value="Жилье">🏠 Жилье</option>
                    <option value="Транспорт">🚗 Транспорт</option><option value="Развлечения">🎉 Развлечения</option>
                    <option value="Здоровье">💊 Здоровье</option><option value="Другое">📦 Другое</option>
                </select>
            </div>
            <div class="form-row">
                <input type="text" id="trans-desc" placeholder="Комментарий">
                <input type="number" id="trans-amount" placeholder="Сумма">
            </div>
            <button class="add-btn" onclick="addTransaction()">Добавить операцию</button>
        </div>
        <ul id="transaction-list" style="margin-top: 10px;"><li class="empty-state">Загрузка...</li></ul>

        <!-- СПИСОК ПОКУПОК -->
        <div class="section-title">🛒 Планируемые покупки</div>
        <div class="add-form" style="flex-direction: row;">
            <input type="text" id="shop-input" placeholder="Что купить? (напр. Хлеб)">
            <button class="add-btn" style="width: auto; padding: 10px 15px;" onclick="addShoppingItem()">+</button>
        </div>
        <ul id="shopping-list"><li class="empty-state">Список пуст</li></ul>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.ready(); tg.expand();
        const userName = tg.initDataUnsafe?.user?.first_name || 'Гость';

        const supabaseUrl = 'https://uycdmmsocewesgppjswf.supabase.co';
        const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InV5Y2RtbXNvY2V3ZXNncHBqc3dmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTQxNjEwMjUsImV4cCI6MjEwOTczNzAyNX0.b8JpqyHy1p7r29aCwPEhufiSTlOxSTk-khDHv_m_PQk'; // <--- ВСТАВЬТЕ ВАШ КЛЮЧ eyJ...
        const supabaseClient = window.supabase.createClient(supabaseUrl, supabaseKey);

        const catEmojis = { 'Продукты': '🍔', 'Жилье': '🏠', 'Транспорт': '🚗', 'Развлечения': '🎉', 'Здоровье': '💊', 'Другое': '📦', 'Уборка': '🧹', 'Работа': '💼', 'Хобби': '🎨' };

        function switchTab(tabName) {
            document.getElementById('tasks-view').style.display = 'none';
            document.getElementById('budget-view').style.display = 'none';
            document.getElementById('tab-tasks').classList.remove('active');
            document.getElementById('tab-budget').classList.remove('active');
            document.getElementById(tabName + '-view').style.display = 'block';
            document.getElementById('tab-' + tabName).classList.add('active');
        }

        // --- ДОМАШНИЙ МЕНЕДЖЕР ---
        async function loadTasks() {
            const { data: tasks, error } = await supabaseClient.from('tasks').select('*').order('created_at', { ascending: false });
            const list = document.getElementById('task-list');
            list.innerHTML = ''; 
            if (error) { list.innerHTML = `<li>Ошибка: ${error.message}</li>`; return; }
            if (tasks.length === 0) { list.innerHTML = `<li class="empty-state">Задач пока нет.</li>`; return; }
            
            tasks.forEach(task => {
                const li = document.createElement('li');
                const leftDiv = document.createElement('div'); leftDiv.className = 'task-left';
                const checkbox = document.createElement('input');
                checkbox.type = 'checkbox'; checkbox.checked = task.is_done;
                checkbox.onchange = () => toggleTask(task.id, task.is_done);
                
                const contentDiv = document.createElement('div'); contentDiv.className = 'task-content';
                
                // Собираем мета-информацию (категория, приоритет, дата, исполнитель)
                const cat = task.category ? `<span class="badge">${catEmojis[task.category] || ''} ${task.category}</span>` : '';
                const prio = task.priority && task.priority !== 'Обычная' ? `<span class="badge" style="color:${task.priority==='Срочная'?'#ff4d4d':'#f39c12'}">${task.priority}</span>` : '';
                const date = task.due_date ? `<span class="badge">📅 ${new Date(task.due_date).toLocaleDateString('ru-RU')}</span>` : '';
                const assignee = task.assignee ? `<span class="badge">👤 ${task.assignee}</span>` : '';

                contentDiv.innerHTML = `
                    <div class="task-title ${task.is_done ? 'done' : ''}">${task.title}</div>
                    <div class="task-meta">${cat} ${prio} ${date} ${assignee}</div>
                `;
                
                leftDiv.appendChild(checkbox); leftDiv.appendChild(contentDiv);
                
                const delBtn = document.createElement('button');
                delBtn.className = 'delete-btn'; delBtn.innerHTML = '✖';
                delBtn.onclick = () => deleteTask(task.id);

                li.appendChild(leftDiv); li.appendChild(delBtn); list.appendChild(li);
            });
        }

        async function addTask() {
            const title = document.getElementById('task-input').value.trim();
            if (!title) return; 
            
            const category = document.getElementById('task-category').value;
            const priority = document.getElementById('task-priority').value;
            const due_date = document.getElementById('task-date').value || null;
            const assignee = document.getElementById('task-assignee').value || null;

            const { error } = await supabaseClient.from('tasks').insert([{ 
                title: title, is_done: false, added_by: userName,
                category: category, priority: priority, due_date: due_date, assignee: assignee
            }]);
            
            if (!error) { 
                document.getElementById('task-input').value = ''; 
                document.getElementById('task-date').value = '';
                loadTasks(); 
            } else { alert('Ошибка: ' + error.message); }
        }

        async function toggleTask(id, currentStatus) {
            await supabaseClient.from('tasks').update({ is_done: !currentStatus }).eq('id', id);
            loadTasks();
        }
        async function deleteTask(id) {
            await supabaseClient.from('tasks').delete().eq('id', id);
            loadTasks();
        }

        // --- БЮДЖЕТ (ТРАНЗАКЦИИ) ---
        async function loadTransactions() {
            const { data: trans, error } = await supabaseClient.from('transactions').select('*').order('created_at', { ascending: false });
            const list = document.getElementById('transaction-list');
            list.innerHTML = ''; 
            let totalIncome = 0; let totalExpense = 0;

            if (error) { list.innerHTML = `<li>Ошибка: ${error.message}</li>`; return; }
            if (trans.length === 0) { list.innerHTML = `<li class="empty-state">Операций пока нет.</li>`; return; }

            trans.forEach(t => {
                const isIncome = t.type === 'income'; const amount = Number(t.amount);
                if (isIncome) totalIncome += amount; else totalExpense += amount;

                const li = document.createElement('li');
                const colorClass = isIncome ? 'income-text' : 'expense-text';
                const sign = isIncome ? '+' : '-';
                const emoji = catEmojis[t.category] || '📦';

                li.innerHTML = `
                    <div class="trans-info">
                        <div class="trans-title"><span class="category-badge">${emoji} ${t.category}</span> <span style="font-size:11px; opacity:0.6;">${t.added_by}</span></div>
                        <div style="font-size:13px;">${t.description}</div>
                    </div>
                    <div style="display:flex; align-items:center; gap:8px;">
                        <div class="trans-amount ${colorClass}">${sign}${amount} ₽</div>
                        <button class="delete-btn" onclick="deleteTransaction('${t.id}')">✖</button>
                    </div>
                `;
                list.appendChild(li);
            });
            document.getElementById('total-income').textContent = `${totalIncome} ₽`;
            document.getElementById('total-expense').textContent = `${totalExpense} ₽`;
            const balance = totalIncome - totalExpense;
            const balanceEl = document.getElementById('total-balance');
            balanceEl.textContent = `${balance} ₽`;
            balanceEl.style.color = balance < 0 ? '#ff4d4d' : 'var(--tg-theme-text-color, #000)';
        }

        async function addTransaction() {
            const type = document.getElementById('trans-type').value;
            const category = document.getElementById('trans-category').value;
            const description = document.getElementById('trans-desc').value.trim();
            const amount = parseFloat(document.getElementById('trans-amount').value);
            if (!description || isNaN(amount) || amount <= 0) { alert("Заполните описание и сумму!"); return; }

            const { error } = await supabaseClient.from('transactions').insert([{ description, amount, type, category, added_by: userName }]);
            if (!error) { document.getElementById('trans-desc').value = ''; document.getElementById('trans-amount').value = ''; loadTransactions(); } 
        }
        async function deleteTransaction(id) {
            await supabaseClient.from('transactions').delete().eq('id', id); loadTransactions();
        }

        // --- СПИСОК ПОКУПОК ---
        async function loadShoppingList() {
            const { data: items, error } = await supabaseClient.from('shopping_list').select('*').order('created_at', { ascending: true });
            const list = document.getElementById('shopping-list');
            list.innerHTML = '';
            if (error) { list.innerHTML = `<li>Ошибка: ${error.message}</li>`; return; }
            if (items.length === 0) { list.innerHTML = `<li class="empty-state">Список покупок пуст</li>`; return; }

            items.forEach(item => {
                const li = document.createElement('li');
                li.innerHTML = `
                    <div class="task-left">
                        <input type="checkbox" ${item.is_bought ? 'checked' : ''} onchange="toggleShoppingItem('${item.id}', ${item.is_bought})">
                        <span class="${item.is_bought ? 'done' : ''}" style="font-size:15px;">${item.title}</span>
                    </div>
                    <button class="delete-btn" onclick="deleteShoppingItem('${item.id}')">✖</button>
                `;
                list.appendChild(li);
            });
        }
        async function addShoppingItem() {
            const input = document.getElementById('shop-input');
            const title = input.value.trim();
            if (!title) return;
            const { error } = await supabaseClient.from('shopping_list').insert([{ title: title, is_bought: false }]);
            if (!error) { input.value = ''; loadShoppingList(); }
        }
        async function toggleShoppingItem(id, currentStatus) {
            await supabaseClient.from('shopping_list').update({ is_bought: !currentStatus }).eq('id', id);
            loadShoppingList();
        }
        async function deleteShoppingItem(id) {
            await supabaseClient.from('shopping_list').delete().eq('id', id); loadShoppingList();
        }

        // Запуск
        loadTasks();
        loadTransactions();
        loadShoppingList();
    </script>
</body>
</html>
