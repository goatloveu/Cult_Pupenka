<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Наш Быт</title>
    <!-- Подключаем SDK Telegram. Это "мост" между нашим сайтом и Telegram -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: var(--tg-theme-bg-color, #ffffff); /* Используем цвет темы Telegram */
            color: var(--tg-theme-text-color, #000000);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            text-align: center;
            padding: 20px;
            box-sizing: border-box;
        }
        h1 {
            font-size: 24px;
            margin-bottom: 8px;
        }
        p {
            font-size: 16px;
            color: var(--tg-theme-hint-color, #707579);
        }
    </style>
</head>
<body>
    <h1 id="greeting">Привет!</h1>
    <p id="user-info">Загрузка данных...</p>

    <script>
        // Инициализируем Telegram Web App
        const tg = window.Telegram.WebApp;
        tg.ready();
        tg.expand(); // Разворачиваем приложение на весь экран

        // Получаем данные пользователя из Telegram
        const user = tg.initDataUnsafe?.user;

        // Находим элементы на странице
        const greetingElement = document.getElementById('greeting');
        const userInfoElement = document.getElementById('user-info');

        // Если данные пользователя получены, показываем их
        if (user) {
            greetingElement.textContent = `Привет, ${user.first_name}!`;
            userInfoElement.textContent = `Твой Telegram ID: ${user.id}. Теперь мы знаем, что это ты.`;
        } else {
            // Если данных нет (например, приложение открыто не из Telegram)
            greetingElement.textContent = 'Привет, незнакомец!';
            userInfoElement.textContent = 'Похоже, ты открыл приложение не через Telegram.';
        }
    </script>
</body>
</html>
