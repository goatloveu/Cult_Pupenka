<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Наш Быт</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: var(--tg-theme-bg-color, #ffffff);
            color: var(--tg-theme-text-color, #000000);
            margin: 0; padding: 20px; box-sizing: border-box;
        }
        h2 { margin-top: 0; }
        .tabs { display: flex; gap: 10px; margin-bottom: 20px; }
        .tab-btn {
            flex: 1; padding: 10px; border-radius: 8px; border: none;
            background-color: var(--tg-theme-secondary-bg-color, #f1f1f1);
            color: var(--tg-theme-text-color, #000); font-size: 16px; font-weight: bold; cursor: pointer;
        }
        .tab-btn.active { background-color: var(--tg-theme-button-color, #2481cc); color: #fff; }

        .add-form { display: flex; gap: 8px; margin-bottom: 20px; flex-wrap: wrap; }
        input, select {
            padding: 12px; border-radius: 8px; border: 1px solid var(--tg-theme-hint-color, #ccc); font-size: 16px;
            box-sizing: border-box;
        }
        input[type="text"] { flex-grow: 1; min-width: 120px; }
        input[type="number"] { width: 100px; }
        select { flex-grow: 1; background-color: var(--tg-theme-bg-color, #ffffff); color: var(--tg-theme-text-color, #000); }
        
        button.add-btn {
            padding: 12px 20px; border-radius: 8px; border: none;
            background-color: var(--tg-theme-button-color, #2481cc); color: #fff;
            font-size: 16px; font-weight: bold; cursor: pointer; width: 100%;
        }
        
        ul { list-style: none; padding: 0; }
        li {
            padding: 15px; background-color: var(--tg-theme-secondary-bg-color, #f1f1f1);
            border-radius: 8px; margin-bottom: 10px; display: flex; align-items: center; justify-content: space-between;
        }
        .task-left { display: flex; align-items: center; gap: 10px; flex-grow: 1; }
        .done { text-decoration: line-through; opacity: 0.6; }
        input[type="checkbox"] { width: 20px; height: 20px; cursor: pointer; }
        
        .delete-btn { background: none; border: none; font-size: 18px; cursor: pointer; color: #ff4d4d; opacity: 0.8; }
        .delete-btn:hover { opacity: 1; }
        
        .budget-summary { 
            display: flex; justify-content: space-between; margin-bottom: 20px; 
            background: var(--tg-theme-secondary-bg-color, #f1f1f1); padding: 15px; border-radius: 8px; text-align: center;
        }
        .budget-summary div { display: flex; flex-direction: column; font-size: 14px; }
        .budget-summary span { font-size: 18px; font-weight: bold; margin-top: 5px; }
        .income-text { color: #2ecc71; }
        .expense-text { color: #ff4d4d; }
        
        .trans-right { display: flex; align-items: center; gap: 10px; }
        
        .category-badge {
            font-size: 12px; background: #e0e0e0; color: #333;
            padding: 2px 8px; border-radius: 12px; margin-right: 4px;
        }
        
        /* Стиль для имени автора */
        .author-text {
            font-size: 12px; opacity: 0.6; font-weight: normal;
        }
    </style>
</head>
<body>
    <div class="tabs">
        <button class="tab-btn active" id="tab-tasks" onclick="switchTab('tasks')">Дела</button>
        <button class="tab-btn" id="tab-budget" onclick="switchTab('budget')">Бюджет</button>
    </div>

    <div id="tasks-view">
        <div class="add-form">
            <input type="text" id="task-input" placeholder="Что нужно сделать?">
            <button class="add-btn" onclick="addTask()">Добавить</button>
        </div>
        <ul id="task-list"><li>Загрузка...</li></ul>
    </div>

    <div id="budget-view" style="display: none;">
        <div class="budget-summary">
            <div>Доходы<br><span id="total-income" class="income-text">0</span> ₽</div>
            <div>Расходы<br><span id="total-expense" class="expense-text">0</span> ₽</div>
            <div>Баланс<br><span id="total-balance">0</span> ₽</div>
        </div>

        <div class="add-form">
            <select id="trans-type">
                <option value="expense">Расход</option>
                <option value="income">Доход</option>
            </select>
            <select id="trans-category">
                <option value="Продукты">Продукты</option>
                <option value="Жилье">Жилье</option>
                <option value="Транспорт">Транспорт</option>
                <option value="Развлечения">Развлечения</option>
                <option value="Здоровье">Здоровье</option>
                <option value="Другое">Другое</option>
            </select>
            <input type="text" id="trans-desc" placeholder="Комментарий">
            <input type="number" id="trans-amount" placeholder="Сумма">
        </div>
        <button class="add-btn" onclick="addTransaction()">Добавить операцию</button>

        <ul id="transaction-list" style="margin-top: 20px;"><li>Загрузка...</li></ul>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.ready(); tg.expand();

        // Берем имя из Telegram. Если имени нет (например, открыли в браузере) - пишем "Гость"
        const userName = tg.initDataUnsafe?.user?.first_name || 'Гость';

        // --- НАСТРОЙКИ SUPABASE ---
        const supabaseUrl = 'https://uycdmmsocewesgppjswf.supabase.co';
        const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InV5Y2RtbXNvY2V3ZXNncHBqc3dmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTQxNjEwMjUsImV4cCI6MjEwOTczNzAyNX0.b8JpqyHy1p7r29aCwPEhufiSTlOxSTk-khDHv_m_PQk'; // <--- ВСТАВЬТЕ ВАШ КЛЮЧ eyJ...
        const supabaseClient = window.supabase.createClient(supabaseUrl, supabaseKey);

        function switchTab(tabName) {
            document.getElementById('tasks-view').style.display = 'none';
            document.getElementById('budget-view').style.display = 'none';
            document.getElementById('tab-tasks').classList.remove('active');
            document.getElementById('tab-budget').classList.remove('active');

            document.getElementById(tabName + '-view').style.display = 'block';
            document.getElementById('tab-' + tabName).classList.add('active');
        }

        // --- ДЕЛА ---
        async function loadTasks() {
            const { data: tasks, error } = await supabaseClient.from('tasks').select('*').order('created_at', { ascending: false });
            const list = document.getElementById('task-list');
            list.innerHTML = ''; 
            if (error) { list.innerHTML = `<li>Ошибка: ${error.message}</li>`; return; }
            if (tasks.length === 0) { list.innerHTML = `<li>Пока нет задач.</li>`; return; }
            
            tasks.forEach(task => {
                const li = document.createElement('li');
                const leftDiv = document.createElement('div');
                leftDiv.className = 'task-left';
                const checkbox = document.createElement('input');
                checkbox.type = 'checkbox'; checkbox.checked = task.is_done;
                checkbox.onchange = () => toggleTask(task.id, task.is_done);
                
                const span = document.createElement('span');
                span.className = task.is_done ? 'done' : ''; 
                
                // Добавляем имя автора к задаче
                const author = task.added_by ? `<span class="author-text"> • ${task.added_by}</span>` : '';
                span.innerHTML = `${task.title} ${author}`;
                
                leftDiv.appendChild(checkbox); leftDiv.appendChild(span);
                
                const delBtn = document.createElement('button');
                delBtn.className = 'delete-btn'; delBtn.innerHTML = '✖';
                delBtn.onclick = () => deleteTask(task.id);

                li.appendChild(leftDiv); li.appendChild(delBtn); list.appendChild(li);
            });
        }

        async function addTask() {
            const input = document.getElementById('task-input');
            const title = input.value.trim();
            if (!title) return; 
            // Отправляем имя автора (userName) в базу
            const { error } = await supabaseClient.from('tasks').insert([{ title: title, is_done: false, added_by: userName }]);
            if (!error) { input.value = ''; loadTasks(); } else { alert('Ошибка: ' + error.message); }
        }

        async function toggleTask(id, currentStatus) {
            await supabaseClient.from('tasks').update({ is_done: !currentStatus }).eq('id', id);
            loadTasks();
        }

        async function deleteTask(id) {
            await supabaseClient.from('tasks').delete().eq('id', id);
            loadTasks();
        }

        // --- БЮДЖЕТ ---
        async function loadTransactions() {
            const { data: trans, error } = await supabaseClient.from('transactions').select('*').order('created_at', { ascending: false });
            const list = document.getElementById('transaction-list');
            list.innerHTML = ''; 
            
            let totalIncome = 0;
            let totalExpense = 0;

            if (error) { list.innerHTML = `<li>Ошибка: ${error.message}</li>`; return; }
            if (trans.length === 0) { list.innerHTML = `<li>Операций пока нет.</li>`; return; }

            trans.forEach(t => {
                const isIncome = t.type === 'income';
                const amount = Number(t.amount);
                
                if (isIncome) totalIncome += amount;
                else totalExpense += amount;

                const li = document.createElement('li');
                const colorClass = isIncome ? 'income-text' : 'expense-text';
                const sign = isIncome ? '+' : '-';

                const cat = t.category ? `<span class="category-badge">${t.category}</span>` : '';
                // Добавляем имя автора к транзакции
                const author = t.added_by ? `<span class="author-text"> • ${t.added_by}</span>` : '';

                const infoDiv = document.createElement('div');
                infoDiv.innerHTML = `
                    <div style="font-weight:bold; margin-bottom: 4px;">
                        ${cat} ${t.description} ${author}
                    </div>
                    <div class="${colorClass}">${sign}${amount} ₽</div>
                `;

                const rightDiv = document.createElement('div');
                rightDiv.className = 'trans-right';
                const delBtn = document.createElement('button');
                delBtn.className = 'delete-btn'; delBtn.innerHTML = '✖';
                delBtn.onclick = () => deleteTransaction(t.id);

                rightDiv.appendChild(delBtn);
                li.appendChild(infoDiv); li.appendChild(rightDiv);
                list.appendChild(li);
            });
            
            document.getElementById('total-income').textContent = totalIncome;
            document.getElementById('total-expense').textContent = totalExpense;
            
            const balance = totalIncome - totalExpense;
            const balanceEl = document.getElementById('total-balance');
            balanceEl.textContent = balance;
            if (balance < 0) balanceEl.style.color = '#ff4d4d';
            else balanceEl.style.color = 'var(--tg-theme-text-color, #000)';
        }

        async function addTransaction() {
            const type = document.getElementById('trans-type').value;
            const category = document.getElementById('trans-category').value;
            const description = document.getElementById('trans-desc').value.trim();
            const amount = parseFloat(document.getElementById('trans-amount').value);

            if (!description || isNaN(amount) || amount <= 0) {
                alert("Заполните описание и укажите положительную сумму!");
                return;
            }

            const { error } = await supabaseClient.from('transactions').insert([{ 
                description: description, 
                amount: amount,
                type: type,
                category: category,
                added_by: userName // Отправляем имя автора
            }]);
            
            if (!error) { 
                document.getElementById('trans-desc').value = ''; 
                document.getElementById('trans-amount').value = ''; 
                loadTransactions(); 
            } else { alert('Ошибка: ' + error.message); }
        }

        async function deleteTransaction(id) {
            const { error } = await supabaseClient.from('transactions').delete().eq('id', id);
            if (!error) loadTransactions();
        }

        loadTasks();
        loadTransactions();
    </script>
</body>
</html>
